<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>YouTube Downloader</title>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/static/favicon.svg" />
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <div class="shell">
      <header class="top">
        <div class="brand">
          <img class="logo" src="/static/favicon.svg" width="40" height="40" alt="" />
          <div>
            <p class="eyebrow">Local machine</p>
            <h1>YouTube Downloader</h1>
          </div>
        </div>
        <p class="lede">
          Paste one video, a playlist, or a bunch of URLs. Files are written to a folder you pick on this computer.
        </p>
      </header>

      <main class="panel">
        <label class="label" for="urls">Links</label>
        <textarea
          id="urls"
          rows="7"
          placeholder="https://www.youtube.com/watch?v=…&#10;https://www.youtube.com/playlist?list=…&#10;https://youtu.be/…"
        ></textarea>

        <div class="grid">
          <div class="field grow">
            <label class="label" for="directory">Save to</label>
            <div class="path">
              <input id="directory" type="text" placeholder="Choose a folder" autocomplete="off" />
              <button type="button" id="browse">Browse</button>
            </div>
          </div>

          <div class="field">
            <label class="label" for="quality">Quality</label>
            <select id="quality">
              <option value="best">Best</option>
              <option value="1080" selected>1080p</option>
              <option value="720">720p</option>
              <option value="480">480p</option>
              <option value="360">360p</option>
            </select>
            <p class="hint" id="quality-hint">Cached after you change it.</p>
          </div>

          <div class="field">
            <span class="label">Media</span>
            <div class="seg" role="group" aria-label="Media type">
              <button type="button" class="seg-btn is-on" data-media="video">Video</button>
              <button type="button" class="seg-btn" data-media="audio">Audio</button>
            </div>
            <p class="hint">Video is the default.</p>
          </div>
        </div>

        <div class="actions">
          <button type="button" class="primary" id="download">Download</button>
          <button type="button" class="ghost" id="cancel" hidden>Stop</button>
        </div>

        <section id="status" class="status" hidden>
          <div class="meter" aria-hidden="true"><span id="bar"></span></div>
          <p id="tally" class="tally">Downloaded 0/0</p>
          <p id="status-line" class="status-line">Ready</p>
          <section id="failed" class="failed" hidden>
            <div class="failed-head">
              <h2>Failed URLs</h2>
              <button type="button" id="retry">Retry failed</button>
            </div>
            <ul id="failed-list" class="failed-list"></ul>
          </section>
          <pre id="log" class="log"></pre>
        </section>
      </main>
    </div>
    <script src="/static/app.js"></script>
  </body>
</html>
